[package]
name = "dispatcher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = "0.30"
h3o = "0.11.0"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
osrm_interface = "0.8"
rayon = "1.10"
anyhow = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bincode = "1.3.0"
reqwest = { version = "0.13.5", features = ["json"] }